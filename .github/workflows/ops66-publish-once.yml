name: HotelOps approved OPS66 one-time acceptance publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops66-publish-once.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: acceptance-preview-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing acceptance repository
        uses: actions/checkout@v4
        with:
          path: acceptance
      - name: Checkout verified HotelOps PR66 source commit
        uses: actions/checkout@v4
        with:
          repository: shawashi/hotel
          ref: 3c2fd54b5dd6e4128556ee76beac03be8431738b
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact SHA and protected regression gate
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3c2fd54b5dd6e4128556ee76beac03be8431738b"
          node ci/check.js
      - name: Generate the acceptance single-file from PR66
        working-directory: source
        env:
          HOTEL_OPS_ACCEPTANCE_OUT: ${{ github.workspace }}/acceptance/index.html
          HOTEL_OPS_BUILD_LABEL: OPS-01～06 前厅新版顺序人工验收 [3c2fd54b5dd6]
        run: |
          set -euo pipefail
          node build-acceptance.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('../acceptance/index.html')
          s=f.read_text()
          assert len(s)>500000
          for marker in ['acceptance-version','__ACCEPTANCE_SINGLE_FILE__','go-front-site','go-front-repair','go-guest-hk','go-room-swap','hotel_ops_uat_quiet_v1','3c2fd54b5dd6']:
              assert marker in s, marker
          assert not re.search(r'<script\b[^>]*\bsrc\s*=',s,re.I)
          assert not re.search(r'<link\b[^>]*\brel=["\x27]stylesheet',s,re.I)
          print('UAT_BUNDLE_VERIFIED',f.stat().st_size)
          PY
      - name: Commit only new acceptance index, preserve all history and Pages settings
        working-directory: acceptance
        run: |
          set -euo pipefail
          git config user.name "HotelOps acceptance publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git diff --cached --check
          git commit -m "uat: publish OPS01-06 and requested frontdesk order, retain history"
          git push origin HEAD:main
          echo "ACCEPTANCE_COMMIT $(git rev-parse HEAD)"
          sha256sum index.html
      - name: Upload exact committed acceptance site
        uses: actions/upload-pages-artifact@v4
        with:
          path: acceptance
      - name: Deploy existing fixed GitHub Pages URL
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live bytes match deployed index
        working-directory: acceptance
        env:
          LIVE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fLsS --max-time 20 --header 'Cache-Control: no-cache' "${LIVE_URL}?ops66=3c2fd54b5dd6&run=${GITHUB_RUN_ID}" -o /tmp/live-ops66.html; then
              if cmp -s index.html /tmp/live-ops66.html; then
                echo "LIVE_VERIFIED $(sha256sum index.html)"
                exit 0
              fi
            fi
            sleep 6
          done
          echo "LIVE_CONTENT_UNVERIFIED" >&2
          exit 1
