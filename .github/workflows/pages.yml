name: Deploy acceptance preview

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: acceptance-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest HotelOps acceptance build
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/shawashi/hotel/main/artifacts/hotel-ops-%E9%AA%8C%E6%94%B6%E6%B5%8B%E8%AF%95%E7%89%88.html" \
            -o index.html
          test -s index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
