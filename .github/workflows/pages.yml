# Adopted through an independently reviewed configuration PR.
# Branch Pages is the only publisher. This workflow has no Pages write permission.
name: Acceptance release audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.nojekyll'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify committed static page without publication
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          body = Path('index.html').read_bytes()
          assert len(body) < 20_000_000, 'Unexpected page size'
          for marker in [b'acceptance-version', b'acceptance-bar', b'App.start']:
              assert marker in body, 'Acceptance page marker missing'
          assert Path('.nojekyll').is_file() and Path('.nojekyll').read_bytes() == b'', 'Static Pages prerequisite missing'
          checksum = hashlib.sha256(body).hexdigest()
          if Path('release.json').exists():
              release = json.loads(Path('release.json').read_text())
              assert re.fullmatch('[a-f0-9]{40}', release['sourceSha']), 'Full source SHA required'
              assert release['htmlSha256'] == checksum, 'Release checksum mismatch'
              print('Source SHA:', release['sourceSha'])
          print('Committed HTML SHA256:', checksum)
          print('Read-only audit passed; this workflow did not publish or verify the live site')
          PY
